<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>결제 실패</title>
</head>
<body>
<h1>❌ 결제에 실패했습니다.</h1>
<p th:text="'실패 사유: ' + ${message}"></p>

<!-- ✅ subscribeId를 포함해서 다시 결제페이지로 이동 -->
<a th:href="@{/pay(subscribeId=${subscribeId})}">결제 페이지로 돌아가기</a>
</body>
</html>
